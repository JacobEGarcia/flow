<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLOW — weather systems in light</title>
<meta name="description" content="A living flow-field: 1,400 particles sketching weather systems in light.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#05070c;overflow:hidden}
  canvas{display:block;position:fixed;inset:0}
  #ui{position:fixed;left:26px;bottom:22px;z-index:5;font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#5c6675;font-size:10px;letter-spacing:.08em;line-height:2;user-select:none}
  #ui b{color:#9aa7ba;font-weight:400}
  #title{position:fixed;left:26px;top:24px;z-index:5;font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#9aa7ba;font-size:13px;letter-spacing:.35em}
  #title span{color:#3d4655}
  #season{position:fixed;right:26px;top:24px;z-index:5;font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#5c6675;font-size:10px;letter-spacing:.2em;text-transform:uppercase}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">FLOW<span> · weather systems in light</span></div>
<div id="season"></div>
<div id="ui"><b>click</b> stir the atmosphere · <b>space</b> next system · <b>f</b> fullscreen</div>
<script>
(function(){
// --- compact simplex noise (2D), seeded ---
var perm=new Uint8Array(512),p=new Uint8Array(256);
var seed=1337;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
for(var i=0;i<256;i++)p[i]=i;
for(var i=255;i>0;i--){var j=Math.floor(rnd()*(i+1));var t=p[i];p[i]=p[j];p[j]=t}
for(var i=0;i<512;i++)perm[i]=p[i&255];
function fade(t){return t*t*t*(t*(t*6-15)+10)}
function grad(h,x,y){var u=h&3;return((u&1)?-x:x)+((u&2)?-y:y)}
function noise(x,y){
  var X=Math.floor(x)&255,Y=Math.floor(y)&255;
  x-=Math.floor(x);y-=Math.floor(y);
  var u=fade(x),v=fade(y);
  var a=perm[X]+Y,b=perm[X+1]+Y;
  return (1-v)*((1-u)*grad(perm[a],x,y)+u*grad(perm[a+1],x-1,y))
        +v*((1-u)*grad(perm[a+1&255]||perm[b],x,y-1)+u*grad(perm[b+1],x-1,y-1));
}

var c=document.getElementById('c'),ctx=c.getContext('2d');
var W,H;function rs(){W=c.width=innerWidth;H=c.height=innerHeight}
rs();addEventListener('resize',rs);

var N=1400,parts=[];
function spawn(i){return {x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,life:Math.random()*300+100,hue:Math.random()}}
for(var i=0;i<N;i++)parts.push(spawn(i));

var SYSTEMS=[
  {name:'HIGH PRESSURE · CALM',scale:.0016,speed:.55,hueA:200,hueB:230,drift:.00004},
  {name:'FRONTAL SYSTEM · RISING',scale:.0028,speed:1.1,hueA:160,hueB:190,drift:.00012},
  {name:'GALE · ELECTRIC',scale:.004,speed:1.9,hueA:260,hueB:320,drift:.0003},
  {name:'MONSOON · WARM RAIN',scale:.0022,speed:1.4,hueA:20,hueB:60,drift:.0002}
];
var sys=0,stir={x:-999,y:-999,e:0};

ctx.fillStyle='#05070c';ctx.fillRect(0,0,W,H);

var z=0;
function frame(){
  var S=SYSTEMS[sys];
  document.getElementById('season').textContent=S.name;
  z+=S.drift*100;
  ctx.fillStyle='rgba(5,7,12,.06)';ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  for(var i=0;i<N;i++){
    var pt=parts[i];
    var a=noise(pt.x*S.scale,pt.y*S.scale+z)*Math.PI*4;
    pt.vx=pt.vx*.92+Math.cos(a)*S.speed*.08;
    pt.vy=pt.vy*.92+Math.sin(a)*S.speed*.08;
    // stir: click injects a vortex
    var dx=pt.x-stir.x,dy=pt.y-stir.y,d2=dx*dx+dy*dy;
    if(d2<40000&&stir.e>0){var f=(1-d2/40000)*stir.e;pt.vx+=-dy*.004*f;pt.vy+=dx*.004*f}
    var nx=pt.x+pt.vx,ny=pt.y+pt.vy;
    var hue=S.hueA+(S.hueB-S.hueA)*((Math.sin(pt.hue*6.28+z*.02)+1)/2);
    ctx.strokeStyle='hsla('+hue+',60%,62%,.5)';
    ctx.lineWidth=.7;
    ctx.beginPath();ctx.moveTo(pt.x,pt.y);ctx.lineTo(nx,ny);ctx.stroke();
    pt.x=nx;pt.y=ny;pt.life--;
    if(pt.life<0||pt.x<-5||pt.x>W+5||pt.y<-5||pt.y>H+5){parts[i]=spawn(i)}
  }
  stir.e*=.94;
  ctx.globalCompositeOperation='source-over';
  requestAnimationFrame(frame);
}
frame();

addEventListener('pointerdown',function(e){stir={x:e.clientX,y:e.clientY,e:1}});
addEventListener('keydown',function(e){
  if(e.key===' '){e.preventDefault();sys=(sys+1)%SYSTEMS.length}
  if(e.key==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
});
})();
</script>
</body>
</html>
